<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đảo Trojan — Pixel Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ ===== -->
<div id="authScreen" class="screen">
  <div class="auth-box">
    <h1>🏝️ ĐẢO TROJAN</h1>
    <p class="sub">Pixel Arena</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Đăng nhập</button>
      <button class="tab-btn" data-tab="register">Đăng ký</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="text" id="loginUser" placeholder="Tên đăng nhập" autocomplete="username" required>
      <input type="password" id="loginPass" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button type="submit" class="primary-btn">Đăng nhập</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="regUser" placeholder="Tên đăng nhập (>=3 ký tự)" required>
      <input type="password" id="regPass" placeholder="Mật khẩu (>=4 ký tự)" required>
      <button type="submit" class="primary-btn">Tạo tài khoản</button>
    </form>

    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- ===== MÀN HÌNH GAME (BẢN ĐỒ NGANG, ĐIỀU KHIỂN KIỂU MOBA) ===== -->
<div id="gameScreen" class="screen hidden">
  <div class="stage" id="stage">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- HUD trên cùng -->
    <div class="hud top">
      <div class="hp-block">
        <div class="hp-name" id="playerName">Người chơi</div>
        <div class="hp-bar"><div class="hp-fill" id="playerHpFill"></div></div>
      </div>
      <div class="level-badge" id="levelBadge">Cấp 1</div>
      <div class="kill-counter" id="killCounter">Hạ gục: 0</div>
    </div>

    <div class="topbar">
      <div class="profile-info" id="profileInfo">—</div>
      <button id="btnLeaderboard" class="mini-btn">🏆</button>
      <button id="btnLogout" class="mini-btn">Thoát</button>
    </div>

    <!-- Banner kết quả dùng ảnh panel gốc từ bộ UI craftpix -->
    <div id="resultBanner" class="result-banner hidden">
      <img id="resultPanelImg" class="result-panel-img" src="assets/ui/win_panel.png">
      <button id="nextBtn" class="panel-action-btn">Tiếp tục</button>
    </div>

    <!-- ======= ĐIỀU KHIỂN KIỂU LIÊN QUÂN MOBILE ======= -->
    <div class="joystick-zone" id="joystickZone">
      <div class="joystick-base" id="joyBase">
        <div class="joystick-knob" id="joyKnob"></div>
      </div>
    </div>

    <div class="skill-cluster">
      <button class="skill-fan-btn sk-fire" id="btnFire" data-skill="fire">
        <span class="sk-icon">🔥</span><div class="cd-overlay" id="cdFire"></div>
      </button>
      <button class="skill-fan-btn sk-water" id="btnWater" data-skill="water">
        <span class="sk-icon">💧</span><div class="cd-overlay" id="cdWater"></div>
      </button>
      <button class="skill-fan-btn sk-lightning" id="btnLightning" data-skill="lightning">
        <span class="sk-icon">⚡</span><div class="cd-overlay" id="cdLightning"></div>
      </button>
      <button class="skill-fan-btn sk-attack" id="btnAttack">
        <span class="sk-icon">⚔️</span>
      </button>
    </div>
  </div>
</div>

<!-- Bảng xếp hạng -->
<div id="leaderboardModal" class="modal hidden">
  <div class="modal-box">
    <h2>🏆 Bảng xếp hạng Đảo Trojan</h2>
    <ol id="leaderboardList"></ol>
    <button id="closeLeaderboard" class="primary-btn">Đóng</button>
  </div>
</div>

<!-- Gợi ý xoay ngang -->
<div class="rotate-hint">
  <div>🔄 Vui lòng xoay ngang thiết bị để chơi Đảo Trojan</div>
</div>

<script src="game.js"></script>
</body>
</html>
